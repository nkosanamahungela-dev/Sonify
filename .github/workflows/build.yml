name: Build

# Every build uses the same private beta keystore. Without it Android
# refuses in-place updates because each hosted runner has a different debug key.
# Add the SONIFY_* signing values as repository Actions secrets before building.
on:
  push:
    branches: [master, spotui-ui-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Configure persistent beta signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SONIFY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SONIFY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SONIFY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SONIFY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::warning::Persistent beta signing secrets are not configured. Building with the runner debug key; this APK may require uninstalling an differently-signed installation."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > sonify-test-signing.p12
          {
            echo "storeFile=sonify-test-signing.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: ./gradlew :app:assembleDev --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: sonify-dev-${{ github.sha }}
          path: app/build/outputs/apk/dev/app-universal-dev.apk
          retention-days: 14
          if-no-files-found: error
